[versions]
kotlin = "2.4.20"
guava = "33.7.1-jre"
lombok = "1.18.48"
shadow = "9.4.3"
ksp = "2.3.7"
micronaut = "5.0.2"
kotlin-logging = "3.0.5"
jackson-kotlin = "3.2.2"
mockk = "1.14.11"
mock-server = "7.6.0"
opencsv = "5.12.0"
poi = "5.5.1"
jasper = "7.0.8"
aws-lambda-java-log4j2 = "1.6.5"
log4j = "2.26.1"
slf4j = "2.0.19"
logback = "1.6.3"
aws-sdk = "2.54.3"
aws-lambda-java-core = "1.4.0"
aws-lambda-java-events = "3.16.1"
azure = "1.17.0"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
semver = "0.19.5"
javaagent = "0.12.2"
byte-buddy-agent = "1.18.13"
rest-assured = "6.0.1"
assertj = "3.27.7"
junit-platform = "6.1.3"
junit-pioneer = "2.3.0"
testcontainers = "2.0.5"
archunit = "1.5.0"
quarkus-plugin = "3.39.0"
quarkus-platform = "3.39.2"
clikt = "5.1.0"
cucumber = "7.34.8"
minio-client = "9.0.3"
micronaut-test-junit5 = "1.1.5"

[libraries]
## Base
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-logging = { module = "io.github.microutils:kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8" }
jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson-kotlin" }

## Export
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
poi = { module = "org.apache.poi:poi", version.ref = "poi" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
jasperreports = { module = "net.sf.jasperreports:jasperreports", version.ref = "jasper" }
jasperreports-pdf = { module = "net.sf.jasperreports:jasperreports-pdf", version.ref = "jasper" }
jasperreports-jdt = { module = "net.sf.jasperreports:jasperreports-jdt", version.ref = "jasper" }

## Scaleway Spring
spring-boot-dependencies = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }

## AWS Vanilla
aws-lambda-java-log4j2 = { module = "com.amazonaws:aws-lambda-java-log4j2", version.ref = "aws-lambda-java-log4j2" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3" }
aws-lambda-java-core = { module = "com.amazonaws:aws-lambda-java-core", version.ref = "aws-lambda-java-core" }
aws-lambda-java-events = { module = "com.amazonaws:aws-lambda-java-events", version.ref = "aws-lambda-java-events" }

## Azure Micronaut
azure-functions-java-library = { module = "com.microsoft.azure.functions:azure-functions-java-library" }
micronaut-azure-sdk = { module = "io.micronaut.azure:micronaut-azure-sdk" }
micronaut-azure-function = { module = "io.micronaut.azure:micronaut-azure-function" }
micronaut-object-storage-azure = { module = "io.micronaut.objectstorage:micronaut-object-storage-azure" }
micronaut-kotlin-runtime = { module = "io.micronaut.kotlin:micronaut-kotlin-runtime" }
micronaut-serde-jackson = { module = "io.micronaut.serde:micronaut-serde-jackson" }
micronaut-inject-java = { module = "io.micronaut:micronaut-inject-java" }
micronaut-http-client = { module = "io.micronaut:micronaut-http-client" }
micronaut-http-validation = { module = "io.micronaut:micronaut-http-validation" }
micronaut-serde-processor = { module = "io.micronaut.serde:micronaut-serde-processor" }
snakeyaml = { module = "org.yaml:snakeyaml" }

## GCP Quarkus
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus-platform" }
quarkus-kotlin = { module = "io.quarkus:quarkus-kotlin" }
quarkus-kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8" }
quarkus-arc = { module = "io.quarkus:quarkus-arc" }
quarkus-gcp-bom = { module = "io.quarkus.platform:quarkus-google-cloud-services-bom", version.ref = "quarkus-platform" }
quarkus-gcp-storage = { module = "io.quarkiverse.googlecloudservices:quarkus-google-cloud-storage" }
quarkus-gcp-functions = { module = "io.quarkus:quarkus-google-cloud-functions" }

## Scaleway Spring
minio-client = { module = "io.minio:minio", version.ref = "minio-client" }

## Local CLI
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

## Test
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-pioneer = { module = "org.junit-pioneer:junit-pioneer", version.ref = "junit-pioneer" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockserver-netty = { module = "org.mock-server:mockserver-netty", version.ref = "mock-server" }
mockserver-client = { module = "org.mock-server:mockserver-client-java", version.ref = "mock-server" }
kotlin-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
testcontainers-localstack = { module = "org.testcontainers:testcontainers-localstack", version.ref = "testcontainers" }
testcontainers-azure = { module = "org.testcontainers:testcontainers-azure", version.ref = "testcontainers" }
testcontainers-mockserver = { module = "org.testcontainers:testcontainers-mockserver", version.ref = "testcontainers" }
byte-buddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "byte-buddy-agent" }
spring-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite", version.ref = "junit-platform" }
quarkus-junit5 = { module = "io.quarkus:quarkus-junit5" }
quarkus-gcp-functions-test = { module = "io.quarkus:quarkus-test-google-cloud-functions" }
cucumber = { module = "io.cucumber:cucumber-java8", version.ref = "cucumber" }
cucumber-junit-platform = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber" }
micronaut-test-junit5 = { module = "io.micronaut.test:micronaut-test-junit5", version.ref = "micronaut-test-junit5" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }


[bundles]
export = ["opencsv", "poi", "poi-ooxml", "jasperreports", "jasperreports-pdf", "jasperreports-jdt"]
aws = ["log4j-slf4j2-impl", "slf4j-api", "aws-sdk-s3", "aws-lambda-java-core", "aws-lambda-java-events"]
azure = ["kotlin-reflect", "kotlin-stdlib-jdk8", "jackson-kotlin", "kotlin-logging", "guava", "azure-functions-java-library", "micronaut-azure-sdk", "micronaut-azure-function", "micronaut-object-storage-azure", "micronaut-kotlin-runtime", "micronaut-serde-jackson"]
gcp = ["quarkus-kotlin", "quarkus-kotlin-stdlib-jdk8", "quarkus-arc", "quarkus-gcp-storage", "quarkus-gcp-functions"]
scaleway = ["spring-boot-dependencies", "spring-boot-starter", "minio-client", "slf4j-api", "kotlin-reflect", "kotlin-logging", "jackson-kotlin", "guava"]
cli = ["clikt", "slf4j-api", "logback"]

## Test
testing = ["assertj", "junit-pioneer", "mockk", "mockserver-netty", "mockserver-client", "kotlin-junit", "rest-assured", "testcontainers-mockserver"]
testing-aws = ["testcontainers-localstack"]
testing-azure = ["testcontainers-azure", "micronaut-test-junit5", "kotlin-test"]
testing-gcp = ["quarkus-gcp-functions-test"]
testing-scaleway = ["testcontainers-localstack", "spring-starter-test"]
testing-core = ["logback"]
cucumber = ["cucumber", "cucumber-junit-platform", "junit-platform-suite"]

[plugins]
kotlinjvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
semver = { id = "com.github.jmongard.git-semver-plugin", version.ref = "semver" }
azure = { id = "com.microsoft.azure.azurefunctions", version.ref = "azure" }
javaagent-test = { id = "com.ryandens.javaagent-test", version.ref = "javaagent" }
quarkus = { id = "io.quarkus", version.ref = "quarkus-plugin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
micronaut-app = { id = "io.micronaut.application", version.ref = "micronaut" }
micronaut-aot = { id = "io.micronaut.aot", version.ref = "micronaut" }